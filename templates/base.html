<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Nicole Musicmaxxing{% endblock %}</title>
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="page">
    <header class="header">
        <div class="container">
            <div class="header-content">
                <a href="{{ url_for('index') }}" class="logo">
                    Nicole Musicmaxxing
                </a>
                <nav>
                    <ul class="nav">
                        <li><a href="{{ url_for('index') }}" class="nav-link">Home</a></li>
                        <li><a href="/dashboard/nnicolema" class="nav-link">Dashboard</a></li>
                        <li><a href="/search/nnicolema" class="nav-link">Search</a></li>
                        <li><a href="/analytics" class="nav-link">Analytics</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
